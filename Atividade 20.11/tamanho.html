<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamanho multivalorado</title>
</head>
<body>

    <style>
    .t1{ font-size: 1rem;
    }
    .t2 { font-size: 2rem;
    }
    .t3 { font-size: 3rem;
    }
    .t4 { font-size: 4rem;
    }
    .t5 { font-size: 5rem;
    }
  </style>

  
  <h2>Digite um texto:</h2>
  <input type="text" id="texto" />
  <button onclick="mostrar()">Mostrar</button>

  <div id="resultado"></div>

  <script>
    function mostrar() {
      const t = document.getElementById("texto").value;
      const r = document.getElementById("resultado");

      r.innerHTML = `
        <p class="t1">${t}</p>
        <p class="t2">${t}</p>
        <p class="t3">${t}</p>
        <p class="t4">${t}</p>
        <p class="t5">${t}</p>
      `;
    }
  </script>

    
    
</body>
</html>
