<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIVIDADE 18/11</title>
    <style>
    button{

    width: 10rem;
    height: 10rem;
    border: 1px solid white;
    border-radius: 100%;
    }
    </style>
</head>
<body>




    <script>
        function cor(red, green, blue){
            document.body.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`
        }

        function criarbola(){
            r = Math.floor(Math.random()*255)
            g = Math.floor(Math.random()*255)
            b = Math.floor(Math.random()*255)
            document.write(`<button onclick="cor(${r},${g},${b})" style="background-color: rgb(${r},${g},${b})"></button>`)

        }
        for(i = 0; i < 100; i++){
            criarbola()
        }


    </script>
    
</body>
</html>
